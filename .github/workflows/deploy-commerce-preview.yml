name: Deploy Commerce Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: commerce-preview
    defaults:
      run:
        working-directory: services/commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Deploy isolated preview Worker
        run: npx wrangler deploy --config wrangler.preview.jsonc
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --config wrangler.preview.jsonc --remote
      - name: Seed compatibility catalog
        run: npx wrangler d1 execute DB --config wrangler.preview.jsonc --remote --file db/seed.sql
      - name: Verify preview health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://beauty-store-commerce-preview.nayererohalamini.workers.dev/api/v1/health > /tmp/commerce-health.json; then
              cat /tmp/commerce-health.json
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Real-network integration
        run: bash tests/integration.sh https://beauty-store-commerce-preview.nayererohalamini.workers.dev
