name: Build Canonical Staging Frontend

on:
  push:
    branches:
      - integration-staging
    paths:
      - "sources/polish/veloura-next/**"
      - ".github/workflows/build-canonical-staging.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integration-staging-build
  cancel-in-progress: true

jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: integration-staging
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install canonical frontend
        working-directory: sources/polish/veloura-next
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck canonical frontend
        working-directory: sources/polish/veloura-next
        run: npm run typecheck

      - name: Build canonical static export
        working-directory: sources/polish/veloura-next
        run: npm run build

      - name: Replace staging public atomically
        run: |
          test -s sources/polish/veloura-next/out/index.html
          rm -rf public.next
          cp -a sources/polish/veloura-next/out public.next
          rm -rf public
          mv public.next public

      - name: Static route smoke
        run: |
          test -s public/index.html
          test -s public/shop/index.html
          test -s public/cart/index.html
          test -s public/checkout/index.html
          test -s public/wishlist/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml

      - name: Commit generated staging output
        run: |
          git config user.name "veloura-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public
          if git diff --cached --quiet; then
            echo "No generated output changes."
            exit 0
          fi
          git commit -m "build(staging): sync canonical VELOURA v2.1 export [generated]"
          git push origin HEAD:integration-staging
