name: Import full ecommerce source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ecommerce.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream source and ZIP archive
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/import-ecommerce.yml /tmp/import-ecommerce.yml
          git clone --depth 1 https://github.com/Abdelrahman-Aboalkhair/Full-Stack-E-Commerce-Platform.git /tmp/upstream
          rm -rf /tmp/upstream/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/upstream/. .
          mkdir -p .github/workflows
          cp /tmp/import-ecommerce.yml .github/workflows/import-ecommerce.yml
          curl -L --fail --retry 3             https://github.com/Abdelrahman-Aboalkhair/Full-Stack-E-Commerce-Platform/archive/refs/heads/main.zip             -o FULL_SOURCE_ARCHIVE.zip
          echo "Imported source files: $(find . -type f | wc -l)"
          echo "Archive size: $(du -h FULL_SOURCE_ARCHIVE.zip | cut -f1)"

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full-stack ecommerce platform source and ZIP"
          git push origin main
