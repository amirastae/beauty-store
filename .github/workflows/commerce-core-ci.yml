name: Commerce Core CI

on:
  push:
    branches:
      - commerce-core-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Wrangler preview dry-run
        run: npx wrangler deploy --config wrangler.preview.jsonc --dry-run

      - name: Base commerce integration
        run: |
          set -euo pipefail
          rm -rf .wrangler/state
          npm run db:migrate:preview-local
          npm run db:seed:preview-local
          npm run dev:preview > /tmp/commerce-core-dev.log 2>&1 &
          worker_pid=$!
          cleanup(){ kill "$worker_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/v1/health >/tmp/core-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/commerce-core-dev.log
            exit 1
          fi
          bash tests/integration.sh http://127.0.0.1:8787
          node tests/concurrent-checkout.mjs http://127.0.0.1:8787

      - name: Payment lifecycle regression
        run: |
          set -euo pipefail
          rm -rf .wrangler/state
          npx wrangler d1 migrations apply DB --config wrangler.payment-test.jsonc --local
          npx wrangler d1 execute DB --config wrangler.payment-test.jsonc --local --file db/seed.sql
          node tests/mock-zarinpal.mjs > /tmp/mock-zarinpal.log 2>&1 &
          mock_pid=$!
          npx wrangler dev --config wrangler.payment-test.jsonc --local --ip 127.0.0.1 --port 8787 > /tmp/payment-worker.log 2>&1 &
          worker_pid=$!
          cleanup(){ kill "$worker_pid" "$mock_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/v1/health >/tmp/payment-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/payment-worker.log
            cat /tmp/mock-zarinpal.log
            exit 1
          fi
          node tests/payment-lifecycle.mjs http://127.0.0.1:8787 http://127.0.0.1:8790
