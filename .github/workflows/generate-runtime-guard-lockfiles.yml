name: Generate runtime guard lockfiles

on:
  push:
    branches:
      - canonical-runtime-release-guard-v1
    paths:
      - ".github/workflows/generate-runtime-guard-lockfiles.yml"

permissions:
  contents: write

concurrency:
  group: generate-runtime-guard-lockfiles
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: canonical-runtime-release-guard-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate canonical lockfile
        working-directory: sources/canonical/veloura-next
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate commerce lockfile
        working-directory: services/commerce
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfiles
        run: |
          set -euo pipefail
          test -s sources/canonical/veloura-next/package-lock.json
          test -s services/commerce/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/canonical/veloura-next/package-lock.json services/commerce/package-lock.json
          if git diff --cached --quiet; then
            echo "LOCKFILES=NO_CHANGES"
            exit 0
          fi
          git commit -m "chore: generate canonical and commerce lockfiles"
          git push origin HEAD:canonical-runtime-release-guard-v1
          echo "LOCKFILES=PASS"
