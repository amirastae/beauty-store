name: Iranian Commerce UX Verify

on:
  workflow_dispatch:
  push:
    branches: [iranian-commerce-ux-v1]
    paths:
      - "veloura-next/**"
      - ".github/workflows/iranian-commerce-ux-verify.yml"

permissions:
  contents: read

concurrency:
  group: iranian-commerce-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: veloura-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run seo:check
      - run: npm run links:check
      - run: npm run catalog:check
      - run: npm run a11y:check
      - run: npm run security:check
      - run: npm run performance:check
      - run: npm run mutation-safety:check
