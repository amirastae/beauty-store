name: Optimize FATIKHAN Source Frames

on:
  push:
    branches:
      - fatikan-cinematic-polish-v2
    paths:
      - ".github/workflows/build-fatikan-webm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fatikan-cinematic-source-opt
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout cinematic branch
        uses: actions/checkout@v5
        with:
          ref: fatikan-cinematic-polish-v2
          fetch-depth: 0

      - name: Ensure ffmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi

      - name: Move source frames out of public and compress
        run: |
          set -euo pipefail
          app="sources/canonical/veloura-next"
          src="$app/public/cinematic/frames"
          dst="$app/cinematic/frames"
          mkdir -p "$dst"

          for input in "$src"/*.png; do
            name="$(basename "$input" .png)"
            ffmpeg -y -v error -i "$input"               -c:v libwebp -lossless 0 -q:v 88 -compression_level 6               "$dst/$name.webp"
          done

          test "$(find "$dst" -maxdepth 1 -name '*.webp' | wc -l | tr -d ' ')" -eq 6
          rm -rf "$src"

          echo "Compressed cinematic source frames:"
          find "$dst" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit optimized source frames
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/canonical/veloura-next/cinematic/frames
          git add -u sources/canonical/veloura-next/public/cinematic/frames
          git commit -m "assets(cinema): archive compressed FATIKHAN source frames"
          git push origin HEAD:fatikan-cinematic-polish-v2
