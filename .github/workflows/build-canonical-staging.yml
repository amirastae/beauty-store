name: Build Canonical Staging Frontend

on:
  push:
    branches:
      - integration-staging
    paths:
      - "sources/canonical/veloura-next/**"
      - ".github/workflows/build-canonical-staging.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integration-staging-build
  cancel-in-progress: true

jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging
        uses: actions/checkout@v7
        with:
          ref: integration-staging
          fetch-depth: 0

      - name: Snapshot clean canonical source for final mirror
        run: |
          set -euo pipefail
          rm -rf /tmp/fatikhan-canonical-source
          mkdir -p /tmp/fatikhan-canonical-source
          git archive HEAD sources/canonical/veloura-next | tar -x -C /tmp/fatikhan-canonical-source

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install canonical frontend
        working-directory: sources/canonical/veloura-next
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run canonical quality gate
        working-directory: sources/canonical/veloura-next
        run: npm run quality

      - name: Replace staging public atomically
        run: |
          test -s sources/canonical/veloura-next/out/index.html
          rm -rf public.next
          cp -a sources/canonical/veloura-next/out public.next
          rm -rf public
          mv public.next public

      - name: Static route smoke
        run: |
          test -s public/index.html
          test -s public/shop/index.html
          test -s public/cart/index.html
          test -s public/checkout/index.html
          test -s public/wishlist/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml

      - name: Verify generated output matches staged public
        run: |
          set -euo pipefail
          diff -qr public sources/canonical/veloura-next/out >/tmp/canonical-public-diff.txt
          grep -qi "FATIKHAN" public/index.html
          ! grep -qi "<title>VELOURA" public/index.html
          test -s public/cinematic/fatikhan-hero.mp4
          test -s public/cinematic/fatikhan-hero.webm
          echo "CANONICAL_PUBLIC_MATCH=PASS"

      - name: Commit canonical public snapshot safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          source_tree="$(git rev-parse HEAD:sources/canonical/veloura-next)"
          rm -rf /tmp/fatikhan-canonical-public
          cp -a public /tmp/fatikhan-canonical-public

          for attempt in 1 2; do
            git fetch origin integration-staging
            remote_source_tree="$(git rev-parse origin/integration-staging:sources/canonical/veloura-next)"

            if [ "$remote_source_tree" != "$source_tree" ]; then
              echo "CANONICAL_PUBLIC_COMMIT=SKIP_NEWER_CANONICAL"
              exit 0
            fi

            git reset --hard origin/integration-staging
            rm -rf public
            cp -a /tmp/fatikhan-canonical-public public

            rm -rf sources/final/veloura-next
            mkdir -p sources/final
            cp -a /tmp/fatikhan-canonical-source/sources/canonical/veloura-next sources/final/veloura-next

            git add -A public sources/final/veloura-next

            if git diff --cached --quiet; then
              echo "CANONICAL_PUBLIC_COMMIT=NO_CHANGES"
              exit 0
            fi

            git commit -m "build(frontend): sync canonical FATIKHAN public"

            if git push origin HEAD:integration-staging; then
              echo "CANONICAL_PUBLIC_COMMIT=PASS"
              exit 0
            fi

            echo "Concurrent staging update detected; retrying once without discarding remote work."
          done

          echo "CANONICAL_PUBLIC_COMMIT=DEFERRED_AFTER_CONCURRENT_UPDATES"
          exit 0
