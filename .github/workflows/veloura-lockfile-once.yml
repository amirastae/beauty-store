name: Veloura Lockfile Once

on:
  push:
    branches: [iranian-commerce-ux-v1]
    paths:
      - ".github/workflows/veloura-lockfile-once.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iranian-commerce-ux-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        working-directory: veloura-next
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veloura-next/package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile already current"
            exit 0
          fi
          git commit -m "chore(deps): commit reproducible Veloura lockfile"
          git push origin HEAD:iranian-commerce-ux-v1
