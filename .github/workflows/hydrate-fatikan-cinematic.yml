name: Hydrate FATIKHAN Cinematic Preview

on:
  push:
    branches:
      - fatikan-cinematic-media-v1
    paths:
      - ".github/workflows/hydrate-fatikan-cinematic.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fatikan-cinematic-hydrate
  cancel-in-progress: true

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fatikan-cinematic-media-v1
          fetch-depth: 0

      - name: Download generated cinematic assets
        run: |
          set -euo pipefail
          root="sources/canonical/veloura-next"
          mkdir -p "$root/public/cinematic/frames"

          curl -LfsS "https://d2ol7oe51mr4n9.cloudfront.net/user_3JX8Mc7x0uX6AZWa8sdkGK4XtQu/4923e3f9-b5fd-4fcb-a514-a15f3be533e6.mp4"             -o "$root/public/cinematic/fatikhan-hero.mp4"

          cp "$root/public/luxury-night-serum-bottle.jpg"             "$root/public/cinematic/frames/scene-01-descent.jpg"

          curl -LfsS "https://d8j0ntlcm91z4.cloudfront.net/user_3JX8Mc7x0uX6AZWa8sdkGK4XtQu/hf_20260921_054207_f8d4586a-01ae-4e8f-9116-1ebd47de6aa4.png"             -o "$root/public/cinematic/frames/scene-02-reveal.png"
          curl -LfsS "https://d8j0ntlcm91z4.cloudfront.net/user_3JX8Mc7x0uX6AZWa8sdkGK4XtQu/hf_20260921_054207_3623a698-bc8b-4f12-a794-84a099cc35a3.png"             -o "$root/public/cinematic/frames/scene-03-burst.png"
          curl -LfsS "https://d8j0ntlcm91z4.cloudfront.net/user_3JX8Mc7x0uX6AZWa8sdkGK4XtQu/hf_20260921_054207_97e8da1a-59ca-408f-bf6b-1608f6afa0bc.png"             -o "$root/public/cinematic/frames/scene-04-impact.png"
          curl -LfsS "https://d8j0ntlcm91z4.cloudfront.net/user_3JX8Mc7x0uX6AZWa8sdkGK4XtQu/hf_20260921_054207_32aba09d-400f-404b-951f-a2609847f534.png"             -o "$root/public/cinematic/frames/scene-05-formula.png"

          cp "$root/public/ugc-serum.jpg"             "$root/public/cinematic/frames/scene-06-ritual.jpg"

          cp "$root/public/editorial-hero.jpg"             "$root/public/cinematic/fatikhan-poster.jpg"

      - name: Validate media payload
        run: |
          set -euo pipefail
          root="sources/canonical/veloura-next/public/cinematic"
          test -s "$root/fatikan-hero.mp4"
          test -s "$root/fatikan-poster.jpg"
          test "$(find "$root/frames" -maxdepth 1 -type f | wc -l)" -eq 6
          bytes="$(stat -c%s "$root/fatikan-hero.mp4")"
          test "$bytes" -gt 1000000
          test "$bytes" -lt 26214400
          echo "FATIKHAN_CINEMATIC_MEDIA=PASS bytes=$bytes"

      - name: Commit hydrated media
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/canonical/veloura-next/public/cinematic
          if git diff --cached --quiet; then
            echo "No media changes"
            exit 0
          fi
          git commit -m "assets(cinema): hydrate FATIKHAN scroll preview"
          git push origin HEAD:fatikan-cinematic-media-v1
