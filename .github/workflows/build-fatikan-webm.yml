name: Build FATIKHAN WebM

on:
  push:
    branches:
      - fatikan-cinematic-polish-v2
    paths:
      - ".github/workflows/build-fatikan-webm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fatikan-webm-build
  cancel-in-progress: true

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout cinematic branch
        uses: actions/checkout@v5
        with:
          ref: fatikan-cinematic-polish-v2
          fetch-depth: 0

      - name: Ensure ffmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Encode seekable VP9 WebM
        run: |
          set -euo pipefail
          root="sources/canonical/veloura-next/public/cinematic"
          input="$root/fatikhan-hero.mp4"
          output="$root/fatikhan-hero.webm"
          test -s "$input"

          ffmpeg -y -i "$input" -an             -c:v libvpx-vp9 -crf 34 -b:v 0             -g 30 -row-mt 1 -threads 8 -deadline good -cpu-used 2             "$output"

          test -s "$output"
          bytes="$(stat -c%s "$output")"
          test "$bytes" -gt 300000
          test "$bytes" -lt 26214400
          echo "FATIKHAN_WEBM=PASS bytes=$bytes"

      - name: Commit WebM
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/canonical/veloura-next/public/cinematic/fatikhan-hero.webm
          if git diff --cached --quiet; then
            echo "WebM already current"
            exit 0
          fi
          git commit -m "assets(cinema): add FATIKHAN VP9 WebM"
          git push origin HEAD:fatikan-cinematic-polish-v2
