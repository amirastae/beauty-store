name: Iranian Commerce UX Verify

on:
  push:
    branches: [iranian-commerce-ux-v1]
    paths:
      - "veloura-next/**"
      - ".github/workflows/iranian-commerce-ux-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veloura-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run seo:check
      - run: npm run links:check
      - run: npm run catalog:check
